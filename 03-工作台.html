          /* ORG-06/07：新增节点选中，复制后展示其直接职位并展开直接下级 */
          this.orgKeyword = '';
          this.posKeyword = '';
          this.includeSub = false;
          this.selectOrg(newId);
          this.orgChain(newId).forEach(x => this.expanded.add(x));
          this.expanded = new Set(this.expanded);
          this.flashOrgIds = new Set([newId]);
          setTimeout(() => { this.flashOrgIds = new Set(); }, 2200);
        } else if (f.mode === 'edit') {
          this.flashOrgIds = new Set([f.targetId]);
          setTimeout(() => { this.flashOrgIds = new Set(); }, 2200);
        }
      },
      /* ORG-08/09：停用/启用确认 */
      askToggleOrg(id, action) {
        if (action === '停用') {
          const org = S.G.org(this.g, id);
          const preview = S.previewStopOrg(this.plan, id);
          const hasTransfer = preview.childOrgIds.length > 0 || preview.positions.length > 0 || preview.employees.length > 0 || preview.headcounts.length > 0 || preview.future.length > 0;
          const hasManual = preview.childOrgIds.length > 0 || preview.positions.some(p => p.status === '有效');
          this.stopForm = { open: true, submitting: false, orgId: id, orgName: org ? org.name : '', mode: hasTransfer && !hasManual ? 'transfer' : 'manual', targetOrgId: null, stopDescendantOrgs: false, stopSubtreePositions: false, err: '' };
        } else {
          OA.ui.confirm({
            title: '启用组织',
            content: '启用只取消该组织的停用标记，不会恢复已迁走的人员和编制。',
            okText: '确认启用',
            onOk: () => {
              const r = S.apply(planId, 'toggleOrg', { id, action });
                this.persistFailed = !S.getPlanData(planId).lastPersistOk;
              if (r.ok) OA.ui.toast('已启用');
              else OA.ui.toast(r.error, 'error');
            }
          });
        }
      },
      submitStopOrg() {
        const f = this.stopForm;
        f.err = '';
        if (f.mode === 'transfer' && !f.targetOrgId) { f.err = '请选择新上级组织'; return; }
        f.submitting = true;
        const r = S.apply(planId, 'stopOrg', {
          orgId: f.orgId, mode: f.mode, targetOrgId: f.targetOrgId,
          stopDescendantOrgs: f.stopDescendantOrgs, stopSubtreePositions: f.stopSubtreePositions
        });
        f.submitting = false;
        this.persistFailed = !S.getPlanData(planId).lastPersistOk;
        if (!r.ok) { f.err = r.error; return; }
        f.open = false;
        OA.ui.toast(f.mode === 'transfer' ? '已转移并停用组织' : '已停用，待处理事项请查看胶囊');
        this.flashOrgIds = new Set([f.orgId]);
        setTimeout(() => { this.flashOrgIds = new Set(); }, 2200);
      },
      /* WF-06 移动组织 */
      openMoveOrg(orgId, targetId) {
        const c = this.subtreeCounts(orgId);
        this.moveOrg = {
          open: true, orgId, targetId,
          fromName: (S.G.org(this.g, orgId) || {}).name,
          toName: (S.G.org(this.g, targetId) || {}).name,
          c
        };
      },
      confirmMoveOrg() {
        const m = this.moveOrg;
        const r = S.apply(planId, 'moveOrg', { id: m.orgId, newParentId: m.targetId });
          this.persistFailed = !S.getPlanData(planId).lastPersistOk;
        if (!r.ok) { OA.ui.toast(r.error, 'error'); return; }
        this.moveOrg.open = false;
        /* ORG-13：展开新路径、选中被移动组织、短暂高亮 */
        this.currentOrgId = m.orgId;
        this.orgChain(m.orgId).forEach(x => this.expanded.add(x));
        this.expanded = new Set(this.expanded);
        const first = (this.positionGroups[0] || { items: [] }).items[0];
        this.currentPositionId = first ? first.id : null;
        this.flashOrgIds = new Set([m.orgId]);
        setTimeout(() => { this.flashOrgIds = new Set(); }, 2200);
      },
      subtreeCounts(orgId) {
        const g = this.g;
        const ids = S.G.descendantIds(g, orgId, true);
        const posIds = new Set(g.positions.filter(p => ids.includes(p.orgId)).map(p => p.id));
        return {
          orgs: ids.length - 1,
          positions: posIds.size,
          headcounts: g.headcounts.filter(h => posIds.has(h.positionId)).length,
          employees: new Set(g.persons.filter(p => p.status === '在职' && p.kind === 'employee' && posIds.has(p.positionId)).map(p => p.id)).size,
          posts: g.posts.filter(t => t.status === '有效' && posIds.has(t.concurrentPositionId)).length,
          future: new Set(g.persons.filter(p => p.status === '未来' && posIds.has(p.targetPositionId)).map(p => p.id)).size
        };
      },
      /* ============ 职位操作 ============ */
      openPosForm(mode, id) {
        const f = { open: true, mode, targetId: id || null, name: '', code: '', orgId: this.currentOrgId, levelMin: null, levelMax: null, setupDate: this.plan.effDate };
        this.posFormErr = '';
        if (mode === 'edit') {
          const p = S.G.position(this.g, id);
          Object.assign(f, { name: p.name, code: p.code, orgId: p.orgId, levelMin: p.levelMin, levelMax: p.levelMax, setupDate: p.setupDate });
        } else if (mode === 'copy') {
          const p = S.G.position(this.g, id);
          Object.assign(f, { name: p.name + '副本', orgId: p.orgId, levelMin: p.levelMin, levelMax: p.levelMax }); // POS-06：不复制人编
        }
        this.posForm = f;
      },
      submitPosForm() {
        const f = this.posForm;
        if (!f.name.trim()) { this.posFormErr = '请填写职位名称'; return; }
        if (!f.levelMin || !f.levelMax) { this.posFormErr = '请选择职级范围'; return; }
        let r;
        if (f.mode === 'edit') r = S.apply(planId, 'editPosition', { id: f.targetId, name: f.name, orgId: f.orgId, levelMin: f.levelMin, levelMax: f.levelMax });
        else if (f.mode === 'copy') r = S.apply(planId, 'copyPosition', { id: f.targetId, name: f.name });
        else r = S.apply(planId, 'addPosition', { orgId: this.currentOrgId, name: f.name, levelMin: f.levelMin, levelMax: f.levelMax });
        if (!r.ok) { this.posFormErr = r.error; return; }
        this.posForm.open = false;
        OA.ui.toast(f.mode === 'edit' ? '职位已更新' : '职位已加入方案');
        if (r.id) {
          this.currentPositionId = r.id; // POS-04：选中新职位
          this.flashPosIds = new Set([r.id]);
          setTimeout(() => { this.flashPosIds = new Set(); }, 2200);
        } else {
          const pid = f.targetId;
          this.flashPosIds = new Set([pid]);
          setTimeout(() => { this.flashPosIds = new Set(); }, 2200);
          const pending = S.computePending(this.plan).filter(x => {
            if (x.kind === 'position') return x.id === pid;
            if (x.kind === 'headcount') { const h = S.G.hc(this.g, x.id); return h && h.positionId === pid; }
            return false;
          });
          if (pending.length) OA.ui.toast('已保存；该职位存在 ' + pending.length + ' 项待处理（如职级不匹配），提交前需处理', 'warning');
        }
      },
      askTogglePos(id, action) {
        if (action === '停用') {
          const p = S.G.position(this.g, id);
          const emps = S.G.employeesAt(this.g, id).length, hcs = S.G.hcsOf(this.g, id).length, futs = S.G.futurePersonsAt(this.g, id).length;
          OA.ui.confirm({
            title: '停用职位',
            content: '停用「' + p.name + '」？停用后卡片与关联区保留；剩余在职员工 ' + emps + ' 人、编制 ' + hcs + ' 个、未来引用 ' + futs + ' 条将形成待处理，提交前需处理。',
            okText: '确认停用', danger: true,
            onOk: () => {
              const r = S.apply(planId, 'togglePosition', { id, action });
                this.persistFailed = !S.getPlanData(planId).lastPersistOk;
              if (r.ok) OA.ui.toast('已停用');
              else OA.ui.toast(r.error, 'error');
            }
          });
        } else {
          OA.ui.confirm({
            title: '启用职位',
            content: '启用只取消停用标记，不会把已转走的对象拉回。',
            okText: '确认启用',
            onOk: () => {
              const r = S.apply(planId, 'togglePosition', { id, action });
                this.persistFailed = !S.getPlanData(planId).lastPersistOk;
              if (r.ok) OA.ui.toast('已启用');
              else OA.ui.toast(r.error, 'error');
            }
          });
        }
      },
      /* POS-12：批量停用，已停用职位不参与 */
      askBatchStop() {
        const valid = this.selectedPositionIds.map(id => S.G.position(this.g, id)).filter(p => p && p.status === '有效');
        if (!valid.length) { OA.ui.toast('所选职位均已停用', 'warning'); return; }
        OA.ui.confirm({
          title: '批量停用职位',
          content: '停用以下 ' + valid.length + ' 个职位？\n' + valid.map(p => p.name).join('、') + '\n停用后保留卡片与待处理，提交前需处理。',
          okText: '确认停用', danger: true,
          onOk: () => {
            let okCount = 0;
            valid.forEach(p => { const r = S.apply(planId, 'togglePosition', { id: p.id, action: '停用' }); if (r.ok) okCount++; });
              this.persistFailed = !S.getPlanData(planId).lastPersistOk;
            this.selectedPositionIds = [];
            OA.ui.toast('已停用 ' + okCount + ' 个职位');
          }
        });
      },
      /* WF-08 整体转移职位（单项拖拽 / 批量移动共用确认） */
      openBatchMove() {
        if (!this.selectedPositionIds.length) return;
        this.openMovePos(this.selectedPositionIds.slice(), null);
      },
      openMovePos(ids, targetOrgId) {
        const g = this.g;
        const posIds = new Set(ids);
        this.movePos = {
          open: true, positionIds: ids, targetOrgId,
          toName: targetOrgId ? ((S.G.org(g, targetOrgId) || {}).name || '') : '',
          c: {
            positions: ids.length,
            employees: new Set(g.persons.filter(p => p.status === '在职' && p.kind === 'employee' && posIds.has(p.positionId)).map(p => p.id)).size,
            headcounts: g.headcounts.filter(h => posIds.has(h.positionId)).length,
            posts: g.posts.filter(t => t.status === '有效' && posIds.has(t.concurrentPositionId)).length,
            future: new Set(g.persons.filter(p => p.status === '未来' && posIds.has(p.targetPositionId)).map(p => p.id)).size
          }
        };
      },
      confirmMovePos() {
        const m = this.movePos;
        if (!m.targetOrgId) { OA.ui.toast('请选择目标组织', 'error'); return; }
        const r = S.apply(planId, 'movePositions', { positionIds: m.positionIds, targetOrgId: m.targetOrgId });
          this.persistFailed = !S.getPlanData(planId).lastPersistOk;
        if (!r.ok) { OA.ui.toast(r.error, 'error'); return; }
        this.movePos.open = false;
        /* POS-10：左侧选目标组织，转入职位短暂高亮，清空批量勾选 */
        this.currentOrgId = m.targetOrgId;
        this.selectedPositionIds = [];
        this.flashPosIds = new Set(m.positionIds);
        setTimeout(() => { this.flashPosIds = new Set(); }, 2200);
      },
      /* ============ 调整范围（NEW-04：仅允许补充组织） ============ */
      openScope() {
        this.scope = { open: true, added: [] };
      },
      scopeInScope(id) { return S._internals.scopeOrgIds(this.plan).has(id); },
      toggleScopeAdd(id) {
        if (this.scopeInScope(id)) return;
        const i = this.scope.added.indexOf(id);
        if (i >= 0) this.scope.added.splice(i, 1); else this.scope.added.push(id);
      },
      confirmScope() {
        if (!this.scope.added.length) { this.scope.open = false; return; }
        const r = S.apply(planId, 'extendScope', { orgIds: this.scope.added.slice() });
          this.persistFailed = !S.getPlanData(planId).lastPersistOk;
        if (!r.ok) { OA.ui.toast(r.error, 'error'); return; }
        OA.ui.toast('已补充 ' + this.scope.added.length + ' 个组织到调整范围');
        this.scope.open = false;
      },
      /* ---- F-04 增编（HC-06，AT-04） ---- */
      openAddHc() {
        this.addHcForm = { level: this.currentPos ? this.currentPos.levelMin : null, count: 1 };
        this.addHcErr = '';
        this.addHcOpen = true;
      },
      submitAddHc() {
        const f = this.addHcForm;
        const r = S.apply(planId, 'addHeadcounts', { positionId: this.currentPositionId, level: f.level, count: f.count });
          this.persistFailed = !S.getPlanData(planId).lastPersistOk;
        if (!r.ok) { this.addHcErr = r.error; return; }
        this.addHcOpen = false;
        OA.ui.toast('已新增 ' + f.count + ' 个编制名额，进入可用空编');
      },
      showDemandInfo(d) {
        OA.ui.info({ title: '需求详情', content: '此处会打开需求详情页（Demo 暂不实现）。\n需求编码：' + d.code + '\n人数：' + d.count + ' 人\n职级：' + d.level });
      },
      /* ---- 树选择数据 ---- */
      universeNodes() {
        const g = this.g;
        const build = pid => S.G.childrenOrgs(g, pid).map(o => ({ id: o.id, name: o.name, status: o.status, children: build(o.id) }));
        return build(null);
      },
      scopeOnlyNodes() {
        const scope = S._internals.scopeOrgIds(this.plan);
        const keep = nodes => nodes.filter(n => scope.has(n.id)).map(n => ({ id: n.id, name: n.name, status: n.status, children: keep(n.children || []) }));
        return keep(this.universeNodes());
      }
    }
  });
</script>

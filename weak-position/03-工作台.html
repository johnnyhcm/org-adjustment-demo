<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0E66FB" />
  <link rel="icon" href="data:," />
  <title>调整工作台</title>
  <link rel="stylesheet" href="shared/vendor/reset.css" />
  <script src="shared/vendor/vue.global.prod.js"></script>
  <script src="shared/vendor/dayjs.min.js"></script>
  <script src="shared/vendor/dayjs-plugin-advancedFormat.js"></script>
  <script src="shared/vendor/dayjs-plugin-customParseFormat.js"></script>
  <script src="shared/vendor/dayjs-plugin-localeData.js"></script>
  <script src="shared/vendor/dayjs-plugin-quarterOfYear.js"></script>
  <script src="shared/vendor/dayjs-plugin-weekOfYear.js"></script>
  <script src="shared/vendor/dayjs-plugin-weekYear.js"></script>
  <script src="shared/vendor/dayjs-plugin-weekday.js"></script>
  <script src="shared/vendor/antd.min.js"></script>
  <link rel="stylesheet" href="shared/theme.css" />
</head>
<body>
<div id="app"></div>

<script type="text/x-template" id="page-tpl">
  <oa-shell title="调整工作台" fill>
    <!-- 方案栏：仅显示方案结果（LAY-06），变化通过胶囊与前后对比表达 -->
    <!-- LAY-08：上区标题栏，左方案名/日期，右仅前后对比 -->
    <div class="wb-planbar">
      <div class="pb-left">
        <span class="pb-name" :title="plan.name">{{ plan.name }}</span>
        <span class="pb-meta">生效日期：{{ plan.effDate }}</span>
        <a-button size="small" @click="openPlanInfo">编辑方案信息</a-button>
      </div>
      <div class="pb-right">
        <a-tooltip :title="historyUndoLabel ? '撤销：' + historyUndoLabel : '没有可撤销的操作'"><a-button size="small" :disabled="!historyCanUndo || historyBlocked" @click="undoLast">撤销</a-button></a-tooltip>
        <a-tooltip :title="historyRedoLabel ? '重做：' + historyRedoLabel : '没有可重做的操作'"><a-button size="small" :disabled="!historyCanRedo || historyBlocked" @click="redoLast">重做</a-button></a-tooltip>
        <a-button size="small" @click="openCompare('view')">前后对比</a-button>
      </div>
    </div>

    <div v-if="suspendedDraft" class="wb-draft-return"><span>已保留{{ suspendedDraft.label }}草稿，处理完成后可返回继续。</span><a-button size="small" @click="resumeBusinessDraft">返回继续</a-button><a @click="suspendedDraft=null">放弃草稿</a></div>

    <div class="workbench">
      <!-- UI-02 / AT-61：暂存失败可见提示与重试 -->
      <div v-if="persistFailed" class="persist-bar" style="position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:900">
        <span>暂存失败，变更未保存（下次打开将丢失）。请重试暂存后再提交。</span>
        <a-button size="small" @click="retryPersist">重试</a-button>
      </div>
      <!-- ============ 左：组织树（LAY-01、WF-05） ============ -->
      <div class="wb-col wb-left">
        <div class="wb-col-head">
          <div class="wb-head-top">
            <div class="wb-col-title">组织</div>
            <div class="wb-head-actions">
              <a-button size="small" @click="openOrgForm('addGlobal')">新增组织</a-button>
            </div>
          </div>
          <div class="wb-toolbar">
            <a-input-search v-model:value="orgKeyword" placeholder="搜索组织名称 / 编码 / 路径" size="small" allow-clear></a-input-search>
          </div>
        </div>
        <div class="wb-col-body">
          <div ref="orgTreeRoot" class="tree-children" data-org-tree="true" style="padding-left:0">
            <svg ref="orgConnectors" class="tree-connectors" aria-hidden="true"></svg>
            <template v-for="n in visibleOrgNodes" :key="n.id">
              <div v-if="orgSortSlotVisible(n, 'before')" :class="['sort-slot', { 'is-active': orgSortSlot.active === orgSlotKey(n, 'before'), 'is-invalid': orgSortSlot.invalid }]"
                   @dragover.prevent="onOrgSortOver($event, n, 'before')" @dragleave="onSortSlotLeave(orgSlotKey(n, 'before'))"
                   @drop.prevent="onOrgSortDrop($event, n, 'before')">
                <span v-if="orgSortSlot.active === orgSlotKey(n, 'before')" class="sort-slot-line"></span>
              </div>
              <div :class="['tree-node', { 'is-active': n.id === currentOrgId, 'is-context': !n.inScope,
                          'is-new': !baseOrgIdSet.has(n.id) && n.status !== '停用', 'is-stopped': n.status === '停用',
                          'drop-ok': dropHoverId === n.id && dropHoverOk, 'drop-bad': dropHoverId === n.id && !dropHoverOk,
                          'oa-flash': flashOrgIds.has(n.id) }]"
                   :style="{ paddingLeft: (n.depth * 20 + 24) + 'px', '--tree-depth': n.depth }"
                   :data-org-id="n.id"
                   :ref="el => setOrgElement(n.id, el)"
                   :draggable="false"
                   @click="selectOrg(n.id)"
                   @dragover.prevent="onTreeDragOver($event, n)"
                   @dragleave="onDragLeave(n.id)"
                   @drop.prevent="onTreeDrop($event, n)"
                   >
                <span :class="['tree-toggle', { 'no-child': !n.children.length }]"
                      :title="expanded.has(n.id) ? '收起' : '展开'" @click.stop="toggleExpand(n.id)">{{ expanded.has(n.id) ? '−' : '+' }}</span>
                <div class="tree-card">
                <div class="tree-row1">
                  <span class="org-drag-handle" :class="{ 'is-placeholder': !n.inScope }" :draggable="n.inScope" title="拖拽移动组织" @click.stop @dragstart.stop="onOrgDragStart($event, n)" @dragend.stop="onDragEnd">⋮⋮</span>
                  <button type="button" class="tree-name tree-name-edit"
                          :title="n.name" @click.stop="showOrgInfo(n.id)">{{ n.name }}</button>
                  <span class="tree-tags" @click.stop>
                    <span v-for="tag in shownOrgTags(n.id)" :key="tag" :class="capClass(tag)">{{ tag }}</span>
                    <a v-if="hiddenOrgTags(n.id).length" class="muted tree-more" @click.stop="showOrgMore(n.id)">更多</a>
                    <a v-if="orgPending[n.id]" class="cap cap-pending" @click.stop="showOrgPending(n.id)">待处理</a>
                  </span>
                  <span class="tree-actions" v-if="n.inScope" @click.stop>
                    <a-dropdown :trigger="['click']" overlayClassName="table-cell-dropdown">
                      <button type="button" class="tree-action-trigger" :aria-label="n.name + '操作'">操作 ▾</button>
                      <template #overlay>
                        <a-menu style="user-select: none; min-width: 120px">
                          <a-menu-item v-if="orgEffective(n.id)" key="edit" @click.stop="openOrgForm('edit', n.id)">编辑</a-menu-item>
                          <a-menu-item v-else key="enable" @click.stop="askToggleOrg(n.id, '启用')">启用</a-menu-item>
                          <a-menu-item v-if="orgEffective(n.id)" key="copy" @click.stop="openOrgForm('copy', n.id)">复制</a-menu-item>
                          <a-menu-item key="positions" @click.stop="openPositionManager(n.id)">管理职位</a-menu-item>
                          <a-menu-item key="add" @click.stop="openOrgForm('add', n.id)">新增</a-menu-item>
                          <a-menu-item v-if="orgEffective(n.id)" key="stop" danger @click.stop="askToggleOrg(n.id, '停用')">停用</a-menu-item>
                        </a-menu>
                      </template>
                    </a-dropdown>
                  </span>
                </div>
                <div class="tree-row2" :title="orgSummaryText(n.id) + '（员工、总编含本组织及全部下级）'">{{ orgSummaryText(n.id) }}</div>
                </div>
              </div>
              <div v-if="orgSortSlotVisible(n, 'after')" :class="['sort-slot', { 'is-active': orgSortSlot.active === orgSlotKey(n, 'after'), 'is-invalid': orgSortSlot.invalid }]"
                   @dragover.prevent="onOrgSortOver($event, n, 'after')" @dragleave="onSortSlotLeave(orgSlotKey(n, 'after'))"
                   @drop.prevent="onOrgSortDrop($event, n, 'after')">
                <span v-if="orgSortSlot.active === orgSlotKey(n, 'after')" class="sort-slot-line"></span>
              </div>
            </template>
            <div v-if="!visibleOrgNodes.length" class="muted" style="padding:10px">无匹配组织</div>
          </div>
        </div>
      </div>

      <!-- 当前组织直属数据，三栏顶部对齐，人编独立搜索、按职位等高同步滚动 -->
      <div class="wb-data-area">
        <div ref="dataPanels" class="wb-data-panels" :style="{ '--wb-group-rows': Math.max(alignedGroups.length, 1) }">
          <!-- ============ 中：编制 ============ -->
          <div class="wb-col wb-mid">
            <div class="wb-col-head">
              <div class="wb-head-top"><div class="wb-head-actions"><a-tooltip :title="autoMatchTip"><a-button size="small" :disabled="autoMatchDisabled" @click="openAutoMatch">自动匹配</a-button></a-tooltip><a-button size="small" :disabled="!scopeOrgOptions.length" @click="openAddHc()"><template #icon><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 3h2v8h8v2h-8v8h-2v-8H3v-2h8z" /></svg></template>增编</a-button></div><div class="wb-title-line"><span class="wb-col-title">编制</span><span class="wb-title-extra wb-inline-stats"><template v-for="(item,i) in breakdownItems(headcountTotals)" :key="item">{{ i ? '｜' : '' }}<span>{{ item }}</span></template></span></div></div>
              <div class="wb-toolbar"><a-input-search v-model:value="hcKeyword" placeholder="搜索编制 / 占用人 / 招聘需求" size="small" allow-clear></a-input-search><label class="wb-check"><input type="checkbox" :checked="allHcsSelected" :indeterminate.prop="hcIndeterminate" :disabled="!hcSelectableItems.length" @change="toggleAllHcs" />全选可用</label></div>
            </div>
            <div class="wb-col-body" @click="onDataBlankClick($event)">
              <div class="wb-batch-slot"><div v-if="selectedHcIds.length" class="rp-hc-batch">已选 {{ selectedHcIds.length }} 个空编<a-button type="text" size="small" class="wb-inline-action" @click="openHcTransfer(selectedHcIds.slice())">变更</a-button><a-button type="text" size="small" class="wb-inline-action" @click="openReduceHc(selectedHcIds.slice())">减编</a-button><a @click="selectedHcIds=[]">取消选择</a></div></div>
              <section v-for="grp in alignedHeadcountGroups" :key="grp.key" class="wb-object-group" :class="{ 'oa-flash': flashPosIds.has(grp.position.id), 'is-context-only': grp.isContextOnly }" :data-align-key="grp.key" :data-pos-id="grp.position.id" :data-group-org="grp.org.id">
                <div class="wb-group-head">
                  <div class="wb-title-line"><button class="wb-group-toggle" :title="grp.position.name" @click="toggleGroup('hc',grp.position.id)">{{ groupCollapsed('hc',grp.position.id) ? '▸' : '▾' }} {{ grp.position.name }}</button><span class="wb-title-extra">总编 {{ grp.totalCount }}｜可用空编 {{ grp.availableCount }}</span></div>
                  <label v-if="grp.availHcs.length" class="wb-check"><input type="checkbox" :checked="groupAllSelected('hc',grp)" :indeterminate.prop="groupSomeSelected('hc',grp)" @change="toggleGroupSelection('hc',grp,$event.target.checked)" />全选本组</label>
                  <a-button type="text" size="small" class="wb-inline-action" @click="openAddHc(grp.position.id)"><template #icon><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 3h2v8h8v2h-8v8h-2v-8H3v-2h8z" /></svg></template>增编</a-button>
                </div>
                <div v-show="!groupCollapsed('hc',grp.position.id)">
            <div v-for="h in grp.allHcs" :key="h.id" :data-hc-id="h.id" :class="['rp-hc', { 'is-active': selectedHcIds.includes(h.id), 'oa-flash': flashHcIds.has(h.id), 'is-occupied': h.state!=='可用' }]" :draggable="h.state==='可用'" @dragstart="onHcDragStart($event,h)" @dragend="onDragEnd">
              <span class="rp-row-lead"><template v-if="h.state==='可用'"><span class="tree-drag" title="拖拽迁移可用空编">⋮⋮</span><input type="checkbox" class="pos-check" :checked="selectedHcIds.includes(h.id)" @click.stop @change="togglePickHc(h.id)" /></template></span>
              <a class="hc-code" @click.stop="showHcInfo(h)">{{ h.code }}</a>
              <span class="wb-row-tags"><span :class="['hc-tag',{'is-available':h.state==='可用'}]">{{ h.state==='可用' ? '可用' : h.type }}</span><a v-if="h.abnormal" class="cap cap-stop" @click.stop="showHcInfo(h)">异常</a><span v-for="tag in h.tags" :key="tag" :class="capClass(tag)">{{ tag }}</span></span>
              <span class="wb-hc-info" :title="h.state==='可用' ? h.level+'，'+h.category+'类' : ''">
                <span v-if="h.state==='可用'" class="hc-meta">{{ h.level }}，{{ h.category }}类</span>
                <a-popover v-else-if="h.type==='浮动'" trigger="click" title="浮动编制占用人" placement="bottomLeft">
                  <template #content><div class="hc-selection-list"><div v-for="a in h.occupants" :key="a.id"><a @click.stop="showPersonInfo()">{{ a.name }}</a> · 浮动结束 {{ h.floatingUntil }}</div></div></template>
                  <button class="wb-summary-link">{{ h.occupants.length }}人</button>
                </a-popover>
                <a v-else-if="h.type==='预留'" :title="[reservationLabel(h),h.person?.name,h.demand?.name].filter(Boolean).join(' · ')" @click.stop="showReservationInfo(h)">{{ reservationLabel(h) }}</a>
                <a v-else v-for="a in h.occupants" :key="a.id" @click.stop="showPersonInfo()">{{ a.name }}</a>
              </span>
              <span class="rp-hc-actions" v-if="!selectedHcIds.length">
                <template v-if="h.state==='可用'">
                  <a-dropdown :trigger="['click']" overlayClassName="table-cell-dropdown"><a-button type="text" size="small" class="wb-inline-action">操作⌄</a-button><template #overlay><a-menu style="user-select:none;min-width:120px"><a-menu-item @click.stop="openBinding(h,'main')">绑定员工</a-menu-item><a-menu-item @click.stop="openBinding(h,'post')">绑定兼职</a-menu-item><a-menu-divider></a-menu-divider><a-menu-item @click.stop="openHcTransfer([h.id])">调编</a-menu-item><a-menu-item @click.stop="openCopyHc(h)">复制</a-menu-item><a-menu-item @click.stop="openReduceHc([h.id])">减编</a-menu-item></a-menu></template></a-dropdown>
                </template>
                <a-button v-else-if="h.type==='主职'" type="text" size="small" class="wb-inline-action" @click.stop="askReleaseHc(h.occupants[0])">解除绑定</a-button>
                <a-button v-else-if="h.type==='长期兼职' || h.type==='短期兼职'" type="text" size="small" class="wb-inline-action" @click.stop="askCancelPost(h.occupants[0])">停止兼职</a-button>
                <a-button v-else-if="h.type==='浮动'" type="text" size="small" class="wb-inline-action" @click.stop="askCancelFloating(h)">取消浮动</a-button>
              </span>
            </div>
            <div v-if="grp.removedHcs.length" class="rp-subhead"><span>已减编（{{ grp.removedHcs.length }}）</span></div>
            <div v-for="h in grp.removedHcs" :key="h.id" class="rp-hc rp-hc-removed">
              <span class="rp-row-lead"></span>
              <span class="hc-code">{{ h.code }}</span>
              <span class="hc-meta">（{{ h.level }}，{{ h.category }}类）</span>
              <span v-for="tag in h.tags" :key="tag" :class="capClass(tag)">{{ tag === '减编' ? '已减编' : tag }}</span>
              <a-button type="text" size="small" class="rp-hc-restore wb-inline-action" @click.stop="restoreHc(h.id)">恢复编制</a-button>
            </div>
                </div>
              </section>
            </div>
          </div>
          <!-- ============ 右：人员 ============ -->
          <div class="wb-col wb-right">
            <div class="wb-col-head"><div class="wb-head-top"><div class="wb-title-line"><span class="wb-col-title">人员</span><span class="wb-title-extra wb-inline-stats"><span>主职 {{ peopleTotals.main }}</span><span v-if="peopleTotals.longTerm > 0">｜长期兼职 {{ peopleTotals.longTerm }}</span><span v-if="peopleTotals.shortTerm > 0">｜短期兼职 {{ peopleTotals.shortTerm }}</span></span></div></div><div class="wb-toolbar"><a-input-search v-model:value="rpKeyword" :placeholder="rpKeywordPlaceholder" size="small" allow-clear></a-input-search><label class="wb-check"><input type="checkbox" :checked="allPeopleSelected" :indeterminate.prop="peopleIndeterminate" :disabled="!peopleSelectableItems.length" @change="toggleAllPeople" />全选</label></div></div>
            <div class="wb-col-body" @click="onDataBlankClick($event)">
              <div class="wb-batch-slot"><div v-if="selectedPersonIds.length" class="rp-batch-bar">已选 {{ selectedPersonIds.length }} 人<a-button type="text" size="small" class="wb-inline-action" @click="openTransfer(selectedPersonIds.slice())">调岗</a-button><a-button type="text" size="small" class="wb-inline-action" @click="askBatchRelease">解除编制</a-button><a @click="selectedPersonIds=[]">取消选择</a></div></div>
              <section v-for="grp in alignedPeopleGroups" :key="grp.key" class="wb-object-group" :class="{ 'oa-flash': flashPosIds.has(grp.position.id), 'is-context-only': grp.isContextOnly }" :data-align-key="grp.key" :data-pos-id="grp.position.id" :data-group-org="grp.org.id">
                <div class="wb-group-head"><button class="wb-group-toggle" @click="toggleGroup('people',grp.position.id)">{{ groupCollapsed('people',grp.position.id) ? '▸' : '▾' }} {{ grp.position.name }}</button><label v-if="grp.people.some(p=>p.isEmp)" class="wb-check"><input type="checkbox" :checked="groupAllSelected('people',grp)" :indeterminate.prop="groupSomeSelected('people',grp)" @change="toggleGroupSelection('people',grp,$event.target.checked)" />全选本组</label></div>
                <div v-show="!groupCollapsed('people',grp.position.id)">
            <div v-for="p in grp.people" :key="p.id" class="rp-person"
                 :data-person-id="p.id" :draggable="p.isEmp" :class="{ 'oa-flash': flashPersonIds.has(p.id), 'is-active': selectedPersonIds.includes(p.id) }"
                 @dragstart="onPersonDragStart($event, p)" @dragend="onDragEnd">
              <!-- PER-03：只有在职人员可勾选/拖拽；未来人员只读；WB-04/WB-10：把手在前、复选框在后，行首固定占位 -->
              <span class="rp-row-lead">
                <span v-if="p.isEmp" class="tree-drag rp-drag" title="拖拽调岗">⋮⋮</span>
                <input v-if="p.isEmp" type="checkbox" class="pos-check" :checked="selectedPersonIds.includes(p.id)" @click.stop @change="togglePickPerson(p.id)" />
              </span>
              <span class="p-name" :title="p.name + (p.level ? '（' + p.level + '）' : '')" @click.stop="showPersonInfo(p)">{{ p.name }}<span v-if="p.level" class="p-level">（{{ p.level }}）</span></span>
              <span class="wb-person-tags">
                <button v-if="!p.marker || p.status==='异常' || p.status==='待绑定'" :class="['wb-assignment-state',stateClass(p.status)]" :title="p.reasons.join('；') || p.ruleReason" @click.stop="showAssignmentState(p)">{{ displayAssignmentState(p.status) }}</button>
                <span v-if="p.marker" class="hc-tag">{{ p.marker }}</span><span v-for="tag in p.tags" :key="tag" :class="capClass(tag)">{{ tag }}</span>
                <button v-if="currentFutureEvents(grp,p.id).length" class="wb-assignment-state cap cap-change" @click.stop="showCurrentFuture(grp,p.id)">未来</button>
              </span>
              <span v-if="p.isEmp && !selectedPersonIds.length" class="rp-actions is-static"><a-button type="text" size="small" class="wb-inline-action" @click.stop="openTransfer([p.id])">调岗</a-button></span>
            </div>
                  <div v-for="t in grp.posts" :key="t.id" :data-person-id="t.id" class="rp-person rp-post" :class="{'oa-flash':flashPersonIds.has(t.id)}">
                    <span class="rp-row-lead"></span><span class="p-name" @click.stop="showPersonInfo()">{{ t.name }}</span>
                    <span class="wb-person-tags"><span class="hc-tag">{{ t.marker }}</span><button v-if="t.status==='异常' || t.status==='待绑定'" :class="['wb-assignment-state',stateClass(t.status)]" :title="t.reasons.join('；') || t.ruleReason" @click.stop="showAssignmentState(t)">{{ displayAssignmentState(t.status) }}</button></span>
                    <span v-if="!selectedPersonIds.length" class="rp-actions is-static"><a-button type="text" size="small" class="wb-inline-action" @click.stop="openTransfer([t.personId])">调岗</a-button></span>
                  </div>
                  <div v-for="event in visibleFutureEvents(grp)" :key="event.id" class="rp-person wb-future-event" :data-event-id="event.id">
                    <span class="rp-row-lead"></span><span class="p-name" @click.stop="showPersonInfo()">{{ event.name }}</span><span class="wb-future-line"><button class="wb-assignment-state cap cap-change" @click.stop="showFutureEvent(event)">未来</button><a class="wb-future-text" :title="eventSummary(event)" @click.stop="showFutureEvent(event)">{{ futureRowText(event) }}</a></span>
                  </div>
                </div>
                <div v-if="!peopleGroups.length && grp.key === alignedPeopleGroups[0].key" class="wb-empty"><div class="wb-empty-title">{{ rpKeyword.trim() ? '无匹配人员' : '暂无人员' }}</div><div class="wb-empty-sub">{{ rpKeyword.trim() ? '可调整人员搜索条件' : '可将人员拖到左侧组织，选择职位后调入' }}</div></div>
              </section>
              <div v-if="!alignedGroups.length" class="wb-empty"><div class="wb-empty-title">{{ rpKeyword.trim() ? '无匹配人员' : '暂无人员' }}</div><div class="wb-empty-sub">{{ rpKeyword.trim() ? '可调整人员搜索条件' : '可将人员拖到左侧组织，选择职位后调入' }}</div></div>
            </div>
          </div>
        </div>
        <div v-if="headcountEmptyText" class="wb-hc-empty" role="status">{{ headcountEmptyText }}</div>
      </div>
    </div>

    <teleport to="body">
      <div v-if="dragTip.visible" class="drag-ghost" :class="{ invalid: !dragTip.ok }"
           :style="{ left: dragTip.x + 'px', top: dragTip.y + 'px' }">
        <div class="drag-ghost-title">{{ dragTip.text }}</div>
        <div v-if="dragTip.note" class="drag-ghost-note">{{ dragTip.note }}</div>
      </div>

        <div>
          <div class="plan-scope-summary">当前范围：{{ planInfoScopeNames || '—' }}</div>
          <div class="plan-scope-tree"><label v-for="n in planInfoVisibleFlat" :key="n.id" class="plan-scope-row" :style="{ paddingLeft: (n.depth * 18 + 4) + 'px' }"><span class="scope-tree-toggle" :class="{ 'no-child': !n.hasChildren }" @click.stop.prevent="togglePlanInfoExpand(n.id)">{{ n.hasChildren ? (planInfo.expanded.includes(n.id) ? '▾' : '▸') : '' }}</span><input type="checkbox" :checked="planInfoScopeEffectiveSet.has(n.id)" :indeterminate.prop="planInfoScopeIndeterminate(n.id)" :disabled="planInfoScopeDisabled(n.id)" @change="togglePlanInfoScope(n.id)" />{{ n.name }}<span v-if="planInfoScopeDerived(n.id)" class="muted">（随上级纳入）</span><span v-else-if="planInfoScopeBlockingMessages(n.id).length" class="scope-blocked-text">（存在在途编制调整流程）</span><span v-else-if="planInfoScopeSelected(n.id) && planInfoScopeImpact(n.id).count" class="scope-warning-text">（存在 {{ planInfoScopeImpact(n.id).count }} 项调整，不能移除）</span><span v-else-if="planInfoScopeSelected(n.id)" class="muted">（已纳入）</span><span v-else-if="planInfoScopeFuture(n.id)" class="scope-warning-text">（{{ planInfoScopeTimelineState(n.id) === 'future-start' ? '未来生效' : '计划停用' }}：{{ planInfoScopeTimelineDate(n.id) }}）</span><span v-else class="muted">（可纳入）</span></label></div>
          <div class="muted" style="margin-top:6px">父组织纳入后会完整包含下级；无有效调整影响的显式组织根可移除。</div>
          <div v-if="planInfoScopeValidation.blocking.length" class="scope-validation is-error">
            <div class="scope-validation-title">校验结果：不能保存方案</div>
            <div v-for="item in planInfoScopeValidation.blocking" class="scope-validation-item">· {{ item.message }}</div>
          </div>
          <div v-else-if="planInfoScopeValidation.warnings.length" class="scope-validation is-warning">

    <!-- WF-10 单人／多人调动：双栏字段，共同目标与共同属性 -->

            <button type="button" class="hc-selection-trigger">已选 {{ hcTf.ids.length }} 个可用空编</button>

      <div class="form-grid hc-change-grid hc-layout-grid">
        <div class="form-label req">部门</div>
        <!-- 对应 DeptTreeSelect；仅允许方案范围内有效部门 -->
        <div class="hc-department-field"><a-tree-select v-model:value="hcTf.header.orgId" :disabled="hcTf.lockOrg" :tree-data="businessOrgOptions" tree-default-expand-all show-search tree-node-filter-prop="title" :allow-clear="false"

        <a-select v-model:value="hcTf.form.level" :disabled="!hcTf.header.posId" :options="hcTfLevelOptions" :placeholder="hcTf.mixed && hcTf.mixed.includes('level') ? '原值不同，请统一选择' : '请选择编制职级'"></a-select>
        <div class="form-label req">编制 ABC 分类</div>
        <a-select v-model:value="hcTf.form.category" :options="hcCategoryOptions" :placeholder="hcTf.mixed && hcTf.mixed.includes('category') ? '原值不同，请统一选择' : '请选择分类'"></a-select>
        <div class="form-label">领色</div>

        <div class="form-label req">是否海外编制</div>
        <a-select v-model:value="hcTf.form.overseas" :options="overseasOptions" :placeholder="hcTf.mixed && hcTf.mixed.includes('overseas') ? '原值不同，请统一选择' : '请选择'"></a-select>
        <div class="form-label req">一级成本中心</div>
        <a-select v-model:value="hcTf.form.costCenterId" :options="costCenterOptions" :placeholder="hcTf.mixed && hcTf.mixed.includes('costCenterId') ? '原值不同，请统一选择' : '请选择一级成本中心'"></a-select>
        <div class="form-label">成本分类</div>
        <a-input :value="hcTfTargetPosition ? hcTfTargetPosition.costCategory : ''" placeholder="选择职位后自动带出" disabled></a-input>
        <div class="form-label req">编制工作地点</div>
        <a-input v-model:value="hcTf.form.workLocation" :placeholder="hcTf.mixed && hcTf.mixed.includes('workLocation') ? '原值不同，请统一选择' : '请输入工作地点'"></a-input>
        <div class="form-label req">编制办公地点</div>
        <a-input v-model:value="hcTf.form.officeLocation" :placeholder="hcTf.mixed && hcTf.mixed.includes('officeLocation') ? '原值不同，请统一选择' : '请输入办公地点'"></a-input>
        <div class="form-label req">预计到岗时间</div>
        <!-- 对应 MyDatePicker；标准日期控件统一输出 YYYY-MM-DD -->
        <a-date-picker v-model:value="hcTf.form.expectedArrivalDate" value-format="YYYY-MM-DD" format="YYYY-MM-DD" :placeholder="hcTf.mixed && hcTf.mixed.includes('expectedArrivalDate') ? '原值不同，请统一选择' : '请选择预计到岗时间'"></a-date-picker>
        <div class="hc-change-note">
          <div class="form-label">备注</div>
          <!-- 对应 MyInput；备注只保存，不进入业务差异 -->
          <a-textarea v-model:value="hcTf.form.remark" :rows="2" :placeholder="hcTf.mixed && hcTf.mixed.includes('remark') ? '原值不同，请统一选择' : '请输入备注'"></a-textarea>
        </div>
      </div>
      <div v-if="hcTfNoPositions" class="form-error">该部门暂无可选职位，请选择其他部门或先新增职位。</div>
      <div v-if="hcTf.err || (hcTfValidation && hcTfValidation !== '暂无编制变更内容')" class="form-error">{{ hcTf.err || hcTfValidation }}</div>
    </a-modal>

    <!-- WF-12 自动匹配：按组织／职位分组预览，整批应用 -->
    <a-modal v-model:open="am.open" title="自动匹配人员和编制" :width="680" ok-text="应用匹配" cancel-text="取消" :ok-button-props="{ disabled: !am.pairs.length }" @ok="confirmAutoMatch">
      <p class="muted">范围：{{ am.scopeName }}。各职位内匹配应占编且待绑定的当前主职／兼职；不占编任职、预留、未来人员和已绑定任职不参与，搜索不影响范围。</p>
      <section v-for="group in am.groups" :key="group.positionId" class="am-group"><div class="strong">{{ group.orgName }} / {{ group.positionName }}（{{ group.pairs.length }} 对）</div><div v-for="pair in group.pairs" :key="pair.postId || pair.personId" class="am-pair"><span>{{ pair.personName }}（{{ pair.postId ? '兼职' : '主职' }}）</span><span>→ {{ pair.hcCode }}</span></div></section>
      <p v-if="!am.pairs.length" class="muted">当前没有可匹配的人员与可用空编。</p>
    </a-modal>

    <!-- F-05 减编：只减当前职位可用空编 -->
    <a-modal v-model:open="rd.open" title="减编确认" ok-text="确认减编" cancel-text="取消" @ok="confirmReduceHc">
      <div class="muted" style="margin-bottom:8px">将删除以下可用空编：</div>
      <div v-for="h in rdHcs" :key="h.id" class="rd-hc">{{ h.code }}（{{ h.level }}，{{ h.category }}类）</div>
      <div class="muted" style="margin-top:8px">只减可用空编，招聘需求 / Offer 占用不参与；删除后该职位编制总量和可用空编同时减少。</div>
      <div v-if="rdErr" style="color:var(--error);margin-top:6px">{{ rdErr }}</div>
    </a-modal>
  </oa-shell>
</script>

<script src="shared/seed-data.js"></script>
<script src="shared/store.js"></script>
<script src="shared/components/proto-components.js"></script>
<script src="shared/shell.js"></script>
<script src="shared/ui-kit.js"></script>
<script>
  const S = OA.store;
  S.load();
  const planId = OA.ui.qs('plan');
  const planMeta = planId ? S.getPlan(planId) : null;
  if (!planMeta) { window.location.href = 'index.html'; throw new Error('no plan'); }
  if (!S.EDITABLE_STATUS.includes(planMeta.status)) { window.location.href = '05-方案详情.html?plan=' + planId; throw new Error('readonly'); }

  OA.ui.mount({
    template: '#page-tpl',
    mounted() {
      this.persistFailed = !S.getPlanData(planId).lastPersistOk;
      window.addEventListener('message', this.onCompareMessage);
      this.$nextTick(() => {
        this.queueOrgConnectorRefresh();
        const root = this.$refs.orgTreeRoot;
        if (root && window.ResizeObserver) {
          this.orgResizeObserver = new ResizeObserver(() => this.queueOrgConnectorRefresh());
          this.orgResizeObserver.observe(root);
          root.closest('.workbench').querySelectorAll('.wb-head-top').forEach(el=>this.orgResizeObserver.observe(el));
        }
      });
    },
    updated() { this.queueOrgConnectorRefresh(); },
    beforeUnmount() {
      window.removeEventListener('message', this.onCompareMessage);
      if (this.orgResizeObserver) this.orgResizeObserver.disconnect();
      if (this.orgConnectorFrame) cancelAnimationFrame(this.orgConnectorFrame);
    },
    data() {
      const ui = S.getUiState(planId);
      return {
        plan: planMeta,
        persistFailed: false,
        compareOpen: false, compareMode: 'view',
        orgKeyword: '', rpKeyword: '', hcKeyword: '', collapsedGroups: [], flashHcIds: new Set(),
        expanded: new Set(),
        orgNodeEls: new Map(), orgResizeObserver: null, orgConnectorFrame: 0,
        currentOrgId: ui.orgId || null,
        currentPositionId: ui.positionId || null,
        flashOrgIds: new Set(), flashPosIds: new Set(),
        /* 批量选择（LAY-03：复选与详情选中态独立） */
        selectedPersonIds: [], selectedHcIds: [], flashPersonIds: new Set(),
        /* M3：人员调岗（WF-10） / 选职位（拖拽中转） / 空编迁移（WF-11） / 自动匹配（WF-12） / 减编（F-05） */
        tf: { open: false, rows: [], lockOrg: false, lockPos: false, bring: true, header: { orgId: null, posId: null, mgrId: null }, form: {}, mixed: [], err: '' },
        hcTf: { open: false, ids: [], lockOrg: false, lockPos: false, header: { orgId: null, posId: null }, form: { level: null, category: 'C', overseas: false, costCenterId: 'CC-DEFAULT', workLocation: '默认', officeLocation: '默认', expectedArrivalDate: '', remark: '' }, err: '' },
        am: { open: false, pairs: [], groups:[], scope:{}, scopeName:'' },
        rd: { open: false, ids: [] }, rdErr: '',
        /* 拖拽状态 */
        dragState: null, dropHoverId: null, dropHoverOk: false,
        orgSortSlot: { active: null, invalid: false },
        dragTip: { visible: false, text: '', note: '', ok: true, x: 0, y: 0 },
        /* 组织表单（F-02：新增/编辑/复制） */
        orgForm: { open: false, mode: 'add', targetId: null, sourceName: '', name: '', code: '', parentId: null, virtualOrg: false, leaderId: null, hrbpId: null, hrbpOwnerId: null, costCenterId: null, costCategory: null, setupDate: '', copyMode: 'org' },
        orgFormErr: '',
        stopForm: { open: false, submitting: false, orgId: null, orgName: '', mode: 'manual', targetOrgId: null, stopDescendantOrgs: false, stopSubtreePositions: false, err: '' },
        /* 移动组织确认（WF-06） */
        moveOrg: { open: false, orgId: null, targetId: null, fromName: '', toName: '', c: {} },
        /* 职位表单（F-03） */
        posForm: { open: false, mode: 'add', targetId: null, name: '', code: '', orgId: null, levelMin: null, levelMax: null, jobSequence: '默认', jobFamily: '默认', jobClass: '默认', costCategory: '默认', collarColor: '白领', setupDate: '', syncIncumbency: true },
        posFormErr: '',
        pm: { open:false, orgId:null, origin:null, keyword:'', showStopped:false, sortOpen:false, orderIds:[] },
        positionBlocked: { open:false, id:null, message:'' },
        suspendedDraft: null,
        /* 方案信息（WB-15） */
        planInfo: { open: false, roots: [], expanded: [], name: '', adjustLevel: null, adjustReason: null, desc: '' },
        planInfoErr: '',
        binding:{open:false,headcountId:null,assignmentType:'main',personId:null,term:'长期',endDate:null,err:''},
        addHcOpen: false, addHcForm: { level: null, count: 1 }, addHcErr: '',
        levels: S.LEVELS
      };
    },
    created() {
      const flat = this.flatten(this.orgTreeAll);
      flat.forEach(n => this.expanded.add(n.id));
      const validOrg = flat.some(n => n.id === this.currentOrgId) ? this.currentOrgId : (flat[0] ? flat[0].id : null);
      this.currentOrgId = validOrg;
      if (this.currentOrgId && !S.G.positionsOfOrg(this.g, this.currentOrgId, false).length) this.currentPositionId = null;
    },
    computed: {
      orgTreeAll() { return S.scopeTree(planId); },
      g() { return S.getPlanData(planId).cur; },
      compareSrc() { return '04-前后对比.html?plan=' + planId + '&embed=1&mode=' + this.compareMode; },
      historyInfo() { return S.historyState(planId); },
      historyCanUndo() { return this.historyInfo.canUndo; },
      historyCanRedo() { return this.historyInfo.canRedo; },
      historyUndoLabel() { return this.historyInfo.undoLabel; },
      historyRedoLabel() { return this.historyInfo.redoLabel; },
      historyBlocked() { return this.binding.open || this.compareOpen || this.planInfo.open || this.orgForm.open || this.stopForm.open || this.posForm.open || this.pm.open || this.pm.sortOpen || this.positionBlocked.open || this.addHcOpen || this.moveOrg.open || this.tf.open || this.hcTf.open || this.am.open || this.rd.open || !!this.dragState; },
      baseOrgIdSet() { return new Set((S.getPlanData(planId).base.orgs || []).map(o => o.id)); },
      showPosts() { return true; }, // PRD 0.7：工作台展示兼职，其他页面开关不变
      workbenchProjection() { return S.workbenchGroups(this.plan,this.currentOrgId,false); },
      scopedDataGroups() {
        const byId=new Map();
        [...this.workbenchProjection.headcounts,...this.workbenchProjection.people].forEach(group=>{
          if(byId.has(group.key))return;
          const data=this.positionData(group.position.id);
          byId.set(group.key,{...group,...data,
            removedHcs:group.removedHcs.map(h=>({...h,code:S.displayCode(this.plan,'headcount',h.id),tags:['减编']}))});
        });
        return byId;
      },
      headcountGroups() {
        const kw=this.hcKeyword.trim().toLowerCase();
        return this.workbenchProjection.headcounts.map(raw=>{
          const group=this.scopedDataGroups.get(raw.key),hit=h=>!kw || [h.code,h.level,h.category,h.type,h.person?.name,h.demand?.code,h.demand?.name,...(h.occupants || []).map(p=>p.name)].join(' ').toLowerCase().includes(kw);
          const allHcs=group.allHcs.filter(hit);
          return {...group,allHcs,availHcs:allHcs.filter(h=>h.state==='可用'),removedHcs:group.removedHcs.filter(hit)};
        }).filter(g=>!kw || g.allHcs.length || g.removedHcs.length);
      },
      headcountEmptyText() {
        if(this.headcountGroups.some(g=>g.allHcs.length || g.removedHcs.length))return '';
        return this.hcKeyword.trim() ? '未找到匹配的编制' : '暂无编制';
      },
      peopleGroups() {
        const kw=this.rpKeyword.trim().toLowerCase(),hit=p=>!kw || p.name.toLowerCase().includes(kw);
        return this.workbenchProjection.people.map(raw=>{
          const group=this.scopedDataGroups.get(raw.key);
          return {...group,people:group.people.filter(hit),posts:group.posts.filter(hit),events:group.events.filter(hit)};
        }).filter(g=>g.people.length || g.posts.length || g.events.length);
      },
      alignedGroups() {
        const hcs=new Map(this.headcountGroups.map(g=>[g.key,g])),people=new Map(this.peopleGroups.map(g=>[g.key,g]));
        return [...this.scopedDataGroups.values()].filter(g=>hcs.has(g.key) || people.has(g.key))
          .sort((a,b)=>Number(a.position.sequenceNo ?? a.position.order ?? 0)-Number(b.position.sequenceNo ?? b.position.order ?? 0))
          .map(g=>({key:g.key,org:g.org,position:g.position,hc:hcs.get(g.key),people:people.get(g.key)}));
      },
      alignedHeadcountGroups() { return this.alignedGroups.map(g=>g.hc || {...this.scopedDataGroups.get(g.key),isContextOnly:true,allHcs:[],availHcs:[],removedHcs:[],demands:[]}); },
      alignedPeopleGroups() { return this.alignedGroups.map(g=>g.people || {...this.scopedDataGroups.get(g.key),isContextOnly:true,people:[],posts:[],events:[]}); },
      headcountTotals() { return S.headcountBreakdown(this.g,this.workbenchProjection.headcounts.flatMap(g=>g.headcounts)); },
      headcountSummary() { return this.breakdownSummary(this.headcountTotals); },
      peopleTotals() {
        const groups=this.workbenchProjection.people,ps=groups.flatMap(g=>g.people),posts=groups.flatMap(g=>g.posts);
        return {...S.personnelBreakdown(ps,posts),employees:ps.length};
      },
      bindingContext() {

      },
      rpKeywordPlaceholder() { return '搜索人员 / 兼职 / 未来人员姓名'; },
      levelOptions() { return this.levels.map(l => ({ value: l, label: l })); },

      virtualOrgOptions() { return [{ value: true, label: '是' }, { value: false, label: '否' }]; },

      copyPreview() {

      stopPreview() {

      },
      stopManualError() { const p=this.stopPreview;if(p.employees.length || p.future.length)return '仍有员工 '+p.employees.length+'、未来人员 '+p.future.length+'，请先处理。';if(p.headcounts.some(h=>h.state!=='可用'))return '仍有招聘需求、Offer 或调入预留锁定编制，请先处理。';return ''; },
      stopHasTransferObjects() {

        }));

      },
      pmOrgName() { return (S.G.org(this.g,this.pm.orgId) || {}).name || ''; },
      pmColumns() { return [{title:'职位名称',key:'name',width:190},{title:'状态',dataIndex:'status',width:70},{title:'职级范围',key:'level',width:120},{title:'人员和编制',key:'counts',width:200},{title:'操作',key:'actions',width:160}]; },
      pmItems() {
        const kw=this.pm.keyword.trim().toLowerCase();
        return S.G.positionsOfOrg(this.g,this.pm.orgId,false).filter(p=>(this.pm.showStopped || p.status==='有效') && (!kw || (p.name+' '+p.code).toLowerCase().includes(kw)))
          .map(p=>({...p,emp:S.CNT.positionEmployees(this.g,p.id),total:S.CNT.totalHeadcounts(this.g,p.id),avail:S.CNT.available(this.g,p.id)}));
      },
      posFormTitle() { return { add: '新增职位', edit: '编辑职位', copy: '复制职位' }[this.posForm.mode]; },
      positionDefaultOptions() { return [{ value: '默认', label: '默认' }]; },
      collarColorOptions() { return ['白领', '蓝领', '灰领'].map(v => ({ value: v, label: v })); },
      /* ORG-04：搜索名称/编码/路径，保留必要祖先 */
      matchedOrgSet() {
        const kw = this.orgKeyword.trim().toLowerCase();
        const set = new Set();
        if (!kw) return set;
        const flat = this.flatten(this.orgTreeAll);
        const hit = new Set(flat.filter(n => {
          const path = S.visiblePathNames(this.g, n.id, this.plan.universe).join('/');
          const code = (S.G.org(this.g, n.id) || {}).code || '';
          return n.name.toLowerCase().includes(kw) || path.toLowerCase().includes(kw) || code.toLowerCase().includes(kw);
        }).map(n => n.id));
        flat.forEach(n => { if (this.orgChain(n.id).some(x => hit.has(x))) set.add(n.id); });
        return set;
      },
      visibleOrgNodes() {
        const kw = this.orgKeyword.trim();
        const rows = this.flatten(this.orgTreeAll).filter(n => {
          if (!kw) return this.ancestorsExpanded(n);

        });

      },
      currentOrgName() { return this.currentOrgId ? (S.G.org(this.g, this.currentOrgId) || {}).name || '' : ''; },
      currentOrgPath() { return this.currentOrgId ? S.visiblePathNames(this.g, this.currentOrgId, this.plan.universe).join(' / ') : ''; },
      selectablePeopleKey() { return this.peopleSelectableItems.map(p=>p.id).join('|'); },
      selectableHcKey() { return this.hcSelectableItems.map(h=>h.id).join('|'); },
      peopleSelectableItems() { return this.peopleGroups.flatMap(g=>g.people).filter(p=>p.isEmp); },
      allPeopleSelected() { return this.peopleSelectableItems.length > 0 && this.peopleSelectableItems.every(p => this.selectedPersonIds.includes(p.id)); },
      peopleIndeterminate() { return this.selectedPersonIds.length > 0 && !this.allPeopleSelected; },
      hcSelectableItems() { return this.headcountGroups.flatMap(g=>g.availHcs); },
      allHcsSelected() { return this.hcSelectableItems.length > 0 && this.hcSelectableItems.every(h => this.selectedHcIds.includes(h.id)); },
      hcIndeterminate() { return this.selectedHcIds.length > 0 && !this.allHcsSelected; },
      rdHcs() { return this.rd.ids.map(id => S.G.hc(this.g, id)).filter(Boolean).map(h => ({ id: h.id, code: h.code, level: h.level, category: h.category || '—' })); },
      addHcPosition() { return S.G.position(this.g,this.addHcForm.posId); },
      addHcPositionOptions() { return this.posOptionsOf(this.addHcForm.orgId); },
      hcLevelOptions() { const p=this.addHcPosition;return p ? this.levels.slice(this.levels.indexOf(p.levelMin),this.levels.indexOf(p.levelMax)+1).map(value=>({value,label:value})) : []; },
      /* ---- M3 计算属性 ---- */

        return Array.from(scope).map(id => S.G.org(this.g, id)).filter(o => o && o.status === '有效')
          .map(o => ({ value: o.id, label: S.visiblePathNames(this.g, o.id, this.plan.universe).join(' / ') }));
      },
      headerPosOptions() { return this.posOptionsOf(this.tf.header.orgId); },
      tfMixedTargets() {
        const people=this.tf.rows.map(r=>S.G.person(this.g,r.personId)).filter(Boolean);
        const mixed=get=>people.length>1 && people.some(p=>get(p)!==get(people[0]));
        return {org:mixed(p=>(S.G.position(this.g,p.positionId)||{}).orgId),pos:mixed(p=>p.positionId),mgr:mixed(p=>p.managerId)};
      },
      hcTfMixedTargets() {
        const hcs=this.hcTf.ids.map(id=>S.G.hc(this.g,id)).filter(Boolean);
        return {org:hcs.length>1 && hcs.some(h=>(S.G.position(this.g,h.positionId)||{}).orgId!==(S.G.position(this.g,hcs[0].positionId)||{}).orgId),pos:hcs.length>1 && hcs.some(h=>h.positionId!==hcs[0].positionId)};
      },
      tfNoPositions() { return this.tf.open && !!this.tf.header.orgId && this.headerPosOptions.length === 0; },
      tfHasHcCount() { return this.tf.rows.filter(r => r.hasHc).length; },
      /* WF-10：把弹框共享目标转换为 store.transferPersons 所需的逐人 payload。 */
      transferFields() { return S.TRANSFER_FIELDS; },
      tfSingleLevel() { const p = this.tf.rows.length === 1 ? S.G.person(this.g, this.tf.rows[0].personId) : null; return p ? p.level : ''; },
      tfPersonnelType() {
        const values = this.tf.rows.map(r => (S.G.person(this.g, r.personId) || {}).personnelType);
        return values.length && values.every(v => v === values[0]) ? values[0] : null;
      },
      tfPayloadRows() {
        return this.tf.rows.map(r => Object.assign({
          personId: r.personId,
          targetOrgId: this.tf.header.orgId,
          targetPositionId: this.tf.header.posId,
          managerId: this.tf.header.mgrId,
          bringHeadcount: !!this.tf.bring && !!r.hasHc
        }, this.tf.form));
      },
      /* 先校验目标字段，再复用数据层逐人校验，确保确认按钮与实际提交使用同一规则。 */
      tfErrorList() {
        if (!this.tf.open) return [];
        const errors = [];
        if (!this.tf.header.orgId) errors.push({ personId: '__target-org', message: '请选择目标部门' });
        if (!this.tf.header.posId) errors.push({ personId: '__target-position', message: '请选择目标职位' });
        if (!this.tf.header.mgrId) errors.push({ personId: '__target-manager', message: '请选择直接上级' });
        this.transferFields.filter(f => f.required && !String(this.tf.form[f.key] || '').trim())
          .forEach(f => errors.push({ personId: '__field-' + f.key, message: '请填写' + f.label }));
        if (errors.length) return errors;
        return S._internals.validateTransfer(S.getPlanData(planId), this.tfPayloadRows, this.plan) || [];
      },
      hasTransferErrors() { return this.tfErrorList.length > 0; },
      autoMatchPreview() { return S._internals.OPS.matchPreview({plan:this.plan,pd:S.getPlanData(planId),payload:{orgId:this.currentOrgId}}); },
      autoMatchDisabled() { return !this.autoMatchPreview.pairs.length; },
      autoMatchTip() { return this.autoMatchDisabled ? '当前组织范围内没有可匹配的无编在职人员与可用空编' : '在各组织、职位内预览匹配；不受搜索条件影响'; },
      hcTfHcs() { return this.hcTf.ids.map(id => S.G.hc(this.g, id)).filter(Boolean).map(h => ({ id: h.id, code: h.code, level: h.level, category: h.category || '—', positionId: h.positionId })); },
      hcTfTargetPosition() { return this.hcTf.header.posId ? S.G.position(this.g, this.hcTf.header.posId) : null; },
      hcTfPositions() { return this.posOptionsOf(this.hcTf.header.orgId); },
      hcTfNoPositions() { return this.hcTf.open && !!this.hcTf.header.orgId && this.hcTfPositions.length === 0; },
      hcTfLevelOptions() {
        const p = this.hcTfTargetPosition;
        if (!p) return [];
        const lo = S.LEVELS.indexOf(p.levelMin), hi = S.LEVELS.indexOf(p.levelMax);
        return lo >= 0 && hi >= lo ? S.LEVELS.slice(lo, hi + 1).map(value => ({ value, label: value })) : [];
      },
      hcTfPayload() {
        const payload = Object.assign({ headcountIds: this.hcTf.ids, targetOrgId: this.hcTf.header.orgId, targetPositionId: this.hcTf.header.posId }, this.hcTf.form);
        payload.remark = payload.remark || ''; // 批量可选空值统一清空。
        return payload;
      },
      hcTfValidation() {
        if (!this.hcTf.open) return '';
        return S._internals.headcountChanges(this.plan, S.getPlanData(planId), this.hcTfPayload).error;
      },
      hcTfCanConfirm() { return !!(this.hcTf.open && !this.hcTfValidation); },
      /* F-02 上级组织可选项：仅方案范围内有效组织；停用/自身/后代/八级禁选 */
      orgParentOptions() {
        const self = this.orgForm.mode === 'edit' ? this.orgForm.targetId : null;
        const dis = new Set();
        if (self) S.G.descendantIds(this.g, self, true).forEach(x => dis.add(x));
        const scope = S._internals.scopeOrgIds(this.plan);
        const walk = nodes => nodes.map(n => ({
          value: n.id,
          title: n.name + (n.status === '停用' ? '（停用）' : '') + (!scope.has(n.id) ? '（范围外）' : ''),
          disabled: dis.has(n.id) || n.status !== '有效' || !scope.has(n.id) || (S.G.orgLevel(this.g, n.id) || 0) >= S.MAX_ORG_LEVEL,
          children: walk(n.children || [])
        }));
        return walk(this.universeNodes());
      },
      /* 人编目标部门：复用标准树控件，仅限制有效状态和方案范围。 */
      businessOrgOptions() {
        const scope = S._internals.scopeOrgIds(this.plan);
        const walk = nodes => nodes.map(n => ({
          value: n.id,
          title: n.name + (n.status === '停用' ? '（停用）' : '') + (!scope.has(n.id) ? '（范围外）' : ''),
          disabled: n.status !== '有效' || !scope.has(n.id),
          children: walk(n.children || [])
        }));
        return walk(this.universeNodes());
      },
      /* F-03 编辑职位：所属组织可选项 = 范围内有效组织 */
      posOrgOptions() {
        const walk = nodes => nodes.map(n => ({
          value: n.id,
          title: n.name + (n.status === '停用' ? '（停用）' : ''),
          disabled: n.status !== '有效',
          children: walk(n.children || [])
        }));
        return walk(this.scopeOnlyNodes());
      },
      /* WB-15 方案信息与范围编辑 */
      planInfoFlat() {
        const out = [];
        const walk = (nodes, depth, parentId) => nodes.forEach(n => { out.push({ id: n.id, name: n.name, status: n.status, depth, parentId, hasChildren: !!(n.children && n.children.length) }); walk(n.children || [], depth + 1, n.id); });
        walk(this.universeNodes(), 0, null);
        return out;
      },
      planInfoVisibleFlat() {
        const byId = new Map(this.planInfoFlat.map(n => [n.id, n]));
        return this.planInfoFlat.filter(n => {
          let parentId = n.parentId;
          while (parentId) {
            if (!this.planInfo.expanded.includes(parentId)) return false;
            parentId = (byId.get(parentId) || {}).parentId || null;
          }
          return true;
        });
      },
      planInfoScopeSelected() { return id => this.planInfo.roots.includes(id); },
      planInfoSelectionState() { return S.scopeSelectionState(this.g, this.planInfo.roots, this.plan.effDate); },
      planInfoScopeEffectiveSet() { return this.planInfoSelectionState.effective; },
      planInfoScopeIndeterminate() { return id => this.planInfoSelectionState.indeterminate.has(id); },
      planInfoScopeDerived() { return id => this.planInfoSelectionState.effective.has(id) && !this.planInfo.roots.includes(id); },
      planInfoScopeFuture() { return id => ['future-start', 'future-stop'].includes(this.planInfoScopeTimelineState(id)); },
      planInfoScopeNames() {
        const g = this.g;
        return this.planInfo.roots.map(id => (S.G.org(g, id) || {}).name).filter(Boolean).join('、');
      },
      planInfoScopeValidation() { try { return S.validateScope(this.g, this.planInfo.roots, this.plan.effDate); } catch (e) { return { warnings: [], blocking: [{ message: '范围校验失败，请重试' }] }; } },
      orgPendingItems() {
        const map = {};
        S.computePending(this.plan).forEach(item => {
          let orgId, label;
          if (item.kind === 'org' || item.kind === 'org-required') {
            const org = S.G.org(this.g, item.id);
            orgId = item.id; label = '组织 ' + (org?.name || item.id);
          } else if (item.kind === 'position') {
            const pos = S.G.position(this.g, item.id);
            orgId = pos?.orgId; label = '职位 ' + (pos?.name || item.id);
          } else if (item.kind === 'headcount') {
            const hc = S.G.hc(this.g, item.id);
            orgId = S.G.position(this.g, hc?.positionId)?.orgId;
            label = '编制 ' + (hc?.code || item.id);
          } else if (item.kind === 'person') {
            const person = S.G.person(this.g, item.id);
            orgId = S.G.position(this.g, person?.targetPositionId || person?.positionId)?.orgId;
            label = '人员 ' + (person?.name || item.id);
          }
          if(item.kind==='post') { const t=this.g.posts.find(t=>t.id===item.id);orgId=S.G.position(this.g,t?.concurrentPositionId)?.orgId;label='兼职 '+(S.G.person(this.g,t?.personId)?.name || item.id); }
          orgId=item.orgId || orgId;
          if (orgId) (map[orgId] ||= []).push({ ...item, label });
        });
        return map;
      },
      orgPending() {
        return Object.fromEntries(Object.keys(this.orgPendingItems).map(id => [id, true]));
      },
      posPending() {
        const map = {};
        S.computePending(this.plan).forEach(x => {
          let posId = null;
          if (x.kind === 'position') posId = x.id;
          else if (x.kind === 'headcount') { const h = S.G.hc(this.g, x.id); posId = h ? h.positionId : null; }
          else if (x.kind === 'person') { const p = S.G.person(this.g, x.id); posId = p ? p.targetPositionId : null; }
          if (posId) map[posId] = (map[posId] || 0) + 1;
        });
        return map;
      }
    },
    watch: {
      currentOrgId() { this.selectedPersonIds=[];this.selectedHcIds=[];this.saveUi();this.resetDataScroll(); },
      currentPositionId() { this.saveUi(); },
      rpKeyword() { this.selectedPersonIds=[];this.resetDataScroll(); },
      hcKeyword() { this.selectedHcIds=[];this.resetDataScroll(); },
      selectablePeopleKey() { const ids=new Set(this.peopleSelectableItems.map(p=>p.id));this.selectedPersonIds=this.selectedPersonIds.filter(id=>ids.has(id)); },
      selectableHcKey() { const ids=new Set(this.hcSelectableItems.map(h=>h.id));this.selectedHcIds=this.selectedHcIds.filter(id=>ids.has(id)); },
      'addHcForm.posId'() { if(this.addHcOpen)this.onAddHcPositionChange(); }
    },
    methods: {
      positionData(pid) {
        if (!pid) return { people: [], ind: 0, avail: 0, availHcs: [], removedHcs: [], dem: 0, posts: [], postCount: 0, demands: [] };
        const g = this.g;
        const diff = S.diffPlan(this.plan);
        const people = [];
        S.G.employeesAt(g, pid).forEach(p => people.push({ id: p.id, name: p.name, level: p.level || null, isEmp: true, occupied: !!p.headcountId, ...S.assignmentHeadcountState(g,p,'main',this.plan.effDate), tags: S.personChangeTags(this.plan, p.id) }));
        const empNoHc = S.G.employeesAt(g, pid).filter(p => S.assignmentHeadcountState(g,p,'main',this.plan.effDate).status==='待绑定').length; // HC-12：无编在职人数
        const demands = [];
        g.demands.forEach(d => {
          const mine = d.headcountIds.map(hid => S.G.hc(g, hid)).filter(Boolean);
          const posMine = mine.filter(h => h.positionId === pid);
          if (!posMine.length) return;
          const atPos = posMine.filter(h => h.state === '需求预留');
          demands.push({
            id: d.id, code: d.code || '—', name: d.name,
            total: posMine.length, count: posMine.length,
            level: d.level || (posMine[0] || {}).level || '—',
            offer: posMine.filter(h => h.state === 'Offer占用').length,
            independent: atPos.length, codes: posMine.map(h => h.code).join('、')
          });
        });
        const posts = S.G.postsOf(g, pid).map(t => ({
          ...t, ...S.assignmentHeadcountState(g,t,'post',this.plan.effDate), id: t.id, name: (S.G.person(g, t.personId) || {}).name || '',
          mainPosName: (S.G.position(g, t.mainPositionId) || {}).name || ''
        }));
        return {
          people,
          allHcs:S.G.hcsOf(g,pid).map(h=>({...h,...S.headcountOccupancy(g,h),code:S.displayCode(this.plan,'headcount',h.id),tags:S.headcountChangeTags(this.plan,h.id),
            abnormal:S.G.position(g,pid) && (this.levels.indexOf(h.level)<this.levels.indexOf(S.G.position(g,pid).levelMin) || this.levels.indexOf(h.level)>this.levels.indexOf(S.G.position(g,pid).levelMax))})),
          events:[...this.workbenchProjection.people,...this.workbenchProjection.headcounts].find(group=>group.position.id===pid)?.events || [],
          empNoHc,
          ind: S.CNT.independentVacant(g, pid),
          avail: S.CNT.available(g, pid),
          availHcs: S.G.availableHcs(g, pid).map(h => ({ id: h.id, code: S.displayCode(this.plan, 'headcount', h.id), level: h.level, category: h.category || '—', tags: S.headcountChangeTags(this.plan, h.id) })),
          removedHcs: diff.headcounts.filter(r => r.changeType === '减编').map(r => S.getRemovedHeadcount(this.plan, r.id)).filter(h => h && h.positionId === pid).map(h => ({ id: h.id, code: S.displayCode(this.plan, 'headcount', h.id), level: h.level, category: h.category || '—', tags: ['减编'] })),
          dem: S.CNT.demandReserved(g, pid),
          demands, posts, postCount: posts.length
        };
      },
      setOrgElement(id, el) {
        if (el) this.orgNodeEls.set(id, el);
        else this.orgNodeEls.delete(id);
      },
      queueOrgConnectorRefresh() {
        if (this.orgConnectorFrame) cancelAnimationFrame(this.orgConnectorFrame);
        this.orgConnectorFrame = requestAnimationFrame(() => {
          this.orgConnectorFrame = requestAnimationFrame(() => {
            this.orgConnectorFrame = 0;
            this.syncPanelHeaders();
            this.refreshOrgConnectors();
          });
        });
      },
      syncPanelHeaders() {
        const root=this.$el?.querySelector?.('.workbench') || document.querySelector('.workbench');if(!root)return;
        const tops=[...root.querySelectorAll('.wb-head-top')];
        const height=Math.ceil(Math.max(24,...tops.map(el=>el.getBoundingClientRect().height)))+47;
        root.style.setProperty('--wb-header-height',height+'px');
      },
      refreshOrgConnectors() {
        const root = this.$refs.orgTreeRoot, svg = this.$refs.orgConnectors;
        if (!root || !svg) return;
        /* Vue 更新后 ref 回调可能暂时保留旧节点；以当前 DOM 为准重建索引。 */
        this.orgNodeEls = new Map(Array.from(root.querySelectorAll('[data-org-id]')).map(el => [el.dataset.orgId, el]));
        const rootRect = root.getBoundingClientRect();
        const width = Math.max(root.scrollWidth, root.clientWidth);
        const height = Math.max(root.scrollHeight, root.clientHeight);
        svg.setAttribute('width', width); svg.setAttribute('height', height);
        svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        const rows = this.visibleOrgNodes;
        const visibleIds = new Set(rows.map(n => n.id));
        const parentIdOf = n => { const org = S.G.org(this.g, n.id); return org ? org.parentId : null; };
        const children = new Map();
        /* 连接关系只认真实 parentId，不能从可见行顺序猜父级；移动组织后也必须重新按数据关系绘制。 */
        rows.forEach(n => {
          const parentId = parentIdOf(n);
          if (!parentId || !visibleIds.has(parentId)) return;
          if (!children.has(parentId)) children.set(parentId, []);
          children.get(parentId).push(n);
        });
        const cardPoint = el => { const r = el.getBoundingClientRect(); return { x: r.left - rootRect.left, y: r.top - rootRect.top + r.height / 2 }; };
        const togglePoint = el => { const r = el.getBoundingClientRect(); return { x: r.left - rootRect.left + r.width / 2, y: r.top - rootRect.top + r.height / 2 }; };
        const horizontal = (x1, y, x2) => { const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', `M ${x1} ${y} H ${x2}`); p.setAttribute('class', 'tree-connector-line'); svg.appendChild(p); };
        rows.forEach(rootNode => {
          const rootEl = this.orgNodeEls.get(rootNode.id); if (!rootEl) return;
          const rootToggle = rootEl.querySelector('.tree-toggle');
          const rootPoint = rootToggle && !rootToggle.classList.contains('no-child') ? togglePoint(rootToggle) : null;
          const rootCard = cardPoint(rootEl.querySelector('.tree-card'));
          if (rootPoint && !visibleIds.has(parentIdOf(rootNode))) horizontal(rootPoint.x, rootCard.y, rootCard.x);
        });
        rows.forEach(parent => {
          const parentEl = this.orgNodeEls.get(parent.id); if (!parentEl) return;
          const toggle = parentEl.querySelector('.tree-toggle');
          const kids = (children.get(parent.id) || []).filter(n => this.orgNodeEls.has(n.id));
          if (!kids.length || !this.expanded.has(parent.id)) return;
          const source = toggle && !toggle.classList.contains('no-child') ? togglePoint(toggle) : cardPoint(parentEl.querySelector('.tree-card'));
          const kidPoints = kids.map(k => cardPoint(this.orgNodeEls.get(k.id).querySelector('.tree-card')));
          const maxY = Math.max(...kidPoints.map(q => q.y));
          const v = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          const minY = Math.min(...kidPoints.map(q => q.y));
          v.setAttribute('d', `M ${source.x} ${source.y} V ${minY} M ${source.x} ${minY} V ${maxY}`); v.setAttribute('class', 'tree-connector-line'); svg.appendChild(v);
          kids.forEach(k => { const q = cardPoint(this.orgNodeEls.get(k.id).querySelector('.tree-card')); horizontal(source.x, q.y, q.x); });
        });
      },

      flatten(nodes) {
        const out = [];
        const walk = (list, depth, path) => {
          list.forEach(n => {
            const idx = out.length;
            const myPath = path.concat([idx]); // 祖先行号链（含自身）
            out.push(Object.assign({}, n, { depth, idx, path: myPath }));
            walk(n.children, depth + 1, myPath);
          });
        };
        walk(nodes, 0, []);
        return out;
      },
      /* 思维导图连线（显示顺序规则）：祖先竖线从祖先行向下延伸到最后一个孩子的拐角为止——
         独生子链条不再拉到底；在最后一个孩子行收半高，之前的孩子及后代行全高穿越 */
      withGuides(rows) {
        const n = rows.length;
        const end = new Array(n).fill(0); // 每行子树的最后一行号
        for (let r = n - 1; r >= 0; r--) {
          let e = r;
          for (let k = r + 1; k < n && rows[k].depth > rows[r].depth; k++) e = Math.max(e, end[k]);
          end[r] = e;
        }
        rows.forEach((row, r) => {
          const guides = [];
          row.path.slice(0, row.depth).forEach((ai, gi) => {
            // 祖先（行号 ai、深度 gi）的最后一个子节点行号
            let cLast = -1;
            for (let k = ai + 1; k <= end[ai]; k++) if (rows[k].depth === gi + 1) cLast = k;
            if (cLast === -1) return;
            if (r < cLast) guides.push({ d: gi, half: false });      // 后面还有兄弟要接线，全高穿越
            else if (r === cLast) guides.push({ d: gi, half: true }); // 最后一个孩子：线到拐角为止
            // r > cLast：线已结束，不画
          });
          row.guides = guides;
        });
        return rows;
      },

          document.body.appendChild(ghost);

      },
      orgSortSlotAllowed(sourceId, targetId) {

        return !!source && !!target && source.parentId === target.parentId && sourceId !== targetId;
      },
      onOrgSortDrop(e, n, edge) {

      /* ============ 职位操作 ============ */
      openPosForm(mode, id, opts = {}) {

        const expanded = this.universeNodes().map(n => n.id);
        const byId = new Map(this.planInfoFlat.map(n => [n.id, n]));
        roots.forEach(id => {
          let node = byId.get(id);
          while (node && node.parentId) {
            if (!expanded.includes(node.parentId)) expanded.push(node.parentId);
            node = byId.get(node.parentId);
          }
        });
        this.planInfo = {
          open: true,
          roots,
          expanded,
          name: this.plan.name || '',

        };

      planInfoScopeDisabled(id) {

        return this.planInfoScopeImpact(id).count > 0;

          return;

        const orgId=pos ? pos.orgId : this.currentOrgId;
        const org=S.G.org(this.g,orgId);
        this.addHcForm={orgId:org && org.status==='有效' ? orgId : null,posId:pos ? pos.id : null,lockOrg:!!pos,lockPos:!!pos,level:pos ? pos.levelMin : null,count:1,category:'C',overseas:false,costCenterId:(org && org.costCenterId)||'CC-DEFAULT',workLocation:'默认',officeLocation:'默认',expectedArrivalDate:this.plan.effDate,remark:''};
        this.addHcErr='';this.addHcOpen=true;
      },
      onAddHcOrgChange() { this.addHcForm.posId=null;this.addHcForm.level=null;this.addHcErr=''; },
      onAddHcPositionChange() { const p=this.addHcPosition;if (p && !this.hcLevelOptions.some(x=>x.value===this.addHcForm.level)) this.addHcForm.level=p.levelMin;this.addHcErr=''; },
      submitAddHc() {
        const f = this.addHcForm;
        const r = S.apply(planId, 'addHeadcounts', { positionId: f.posId, level: f.level, count: f.count, category: f.category, overseas: f.overseas, costCenterId: f.costCenterId, workLocation: f.workLocation, officeLocation: f.officeLocation, expectedArrivalDate: f.expectedArrivalDate, remark: f.remark });
          this.persistFailed = !S.getPlanData(planId).lastPersistOk;
        if (!r.ok) { this.addHcErr = r.error; return; }
        this.addHcOpen = false;
        this.locateHeadcounts(f.posId,r.ids || []);
        OA.ui.toast('已新增 ' + f.count + ' 个编制名额，进入可用空编');
      },
      showDemandInfo(d) {
        OA.ui.info({ title: '需求详情', content: '此处会打开需求详情页（Demo 暂不实现）。\n需求编码：' + d.code + '\n人数：' + d.count + ' 人\n职级：' + d.level });
      },
      /* ---- 树选择数据 ---- */
      universeNodes() {
        const g = this.g;
        const build = o => ({ id: o.id, name: o.name, status: o.status, effectiveFrom: o.effectiveFrom || null, effectiveTo: o.effectiveTo || null, children: S.G.childrenOrgs(g, o.id).filter(x => S.orgTimelineState(g, x, this.plan.effDate) !== 'inactive').map(build) });
        return S.permissionRoots(this.plan.universe).map(id => S.G.org(g, id)).filter(Boolean).filter(o => S.orgTimelineState(g, o, this.plan.effDate) !== 'inactive').map(build);
      },
      scopeOnlyNodes() {
        const scope = S._internals.scopeOrgIds(this.plan);
        const keep = nodes => nodes.filter(n => scope.has(n.id)).map(n => ({ id: n.id, name: n.name, status: n.status, children: keep(n.children || []) }));
        return keep(this.universeNodes());
      }
    }
  });
</script>

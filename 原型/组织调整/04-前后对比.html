<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0E66FB" />
  <title>前后对比</title>
  <link rel="stylesheet" href="shared/vendor/reset.css" />
  <script src="shared/vendor/vue.global.prod.js"></script>
  <script src="shared/vendor/dayjs.min.js"></script>
  <script src="shared/vendor/dayjs-plugin-advancedFormat.js"></script>
  <script src="shared/vendor/dayjs-plugin-customParseFormat.js"></script>
  <script src="shared/vendor/dayjs-plugin-localeData.js"></script>
  <script src="shared/vendor/dayjs-plugin-quarterOfYear.js"></script>
  <script src="shared/vendor/dayjs-plugin-weekOfYear.js"></script>
  <script src="shared/vendor/dayjs-plugin-weekYear.js"></script>
  <script src="shared/vendor/dayjs-plugin-weekday.js"></script>
  <script src="shared/vendor/antd.min.js"></script>
  <link rel="stylesheet" href="shared/theme.css" />
</head>
<body>
<div id="app"></div>

<script type="text/x-template" id="page-tpl">
  <oa-shell :title="mode === 'submit' ? '提交前确认' : '前后对比'">
    <div v-if="plan" style="max-width:1280px">
      <!-- CMP-04：方案基本信息（本页不修改日期和范围） -->
      <div class="card-shadow table-main" style="padding:12px 16px">
        <div class="cmp-info">
          <span class="basic-title">{{ plan.name }}</span>
          <span class="muted">生效日期：{{ plan.effDate }}</span>
          <span class="muted">调整范围：{{ scopeText }}</span>
          <span class="muted" v-if="plan.desc">方案说明：{{ plan.desc }}</span>
        </div>

        <!-- CMP-05/06/07：双架构图（同一份数据的调整前/后） -->
        <div class="cmp-chart" ref="chartSec">
          <div class="cmp-toolbar">
            <a-input-search v-model:value="kw" placeholder="搜索组织名称 / 编码" size="small" style="width:220px" allow-clear></a-input-search>
            <span style="flex:1"></span>
            <a-button size="small" @click="zoomStep(-1)">−</a-button>
            <span class="muted" style="min-width:44px;text-align:center">{{ Math.round(zoom * 100) }}%</span>
            <a-button size="small" @click="zoomStep(1)">＋</a-button>
            <a-button size="small" @click="fitCanvas">适应画布</a-button>
            <a-button size="small" @click="toggleFull">{{ full ? '退出全屏' : '全屏' }}</a-button>
          </div>
          <div class="cmp-panels">
            <div class="cmp-side">
              <div class="cmp-side-title">调整前</div>
              <div class="cmp-viewport" ref="leftView" @mousedown="startPan" @mousemove="onPan" @mouseup="endPan" @mouseleave="endPan">
                <div class="cmp-tree" :style="{ transform: 'scale(' + zoom + ')', width: panWidth }">
                  <template v-for="n in leftRows" :key="'L' + n.id">
                    <div :class="['tree-node', 'cmp-node', { 'is-context': n.depth > 0 }]"
                         :style="{ paddingLeft: (n.depth * 20 + 4) + 'px' }" @click="showOrgDiff(n.id)">
                      <span v-for="(gd, gi) in n.guides" :key="'lg' + gi" class="tree-guide"
                            :style="{ left: (gd * 20 + 12) + 'px', height: (gd.half ? '12px' : '100%') }"></span>
                      <span v-if="n.depth > 0" class="tree-elbow" :style="{ left: (n.depth * 20 - 8) + 'px' }"></span>
                      <div class="tree-row1">
                        <span :class="['tree-toggle', { 'no-child': !n.children.length }]">{{ expanded.has('L' + n.id) ? '−' : '+' }}</span>
                        <span class="tree-name" :title="n.name">{{ n.name }}</span>
                        <span v-if="n.stoppedInCur" class="cap cap-stop">已停用</span>
                      </div>
                      <div class="tree-row2 cmp-counts" v-if="expanded.has('L' + n.id)">职位 {{ n.s.positions }}｜在职 {{ n.s.employees }}｜编制 {{ n.s.headcounts }}<span v-if="n.s.future">｜未来 {{ n.s.future }}</span></div>
                    </div>
                  </template>
                </div>
              </div>
            </div>
            <div class="cmp-side">
              <div class="cmp-side-title">调整后</div>
              <div class="cmp-viewport" ref="rightView" @mousedown="startPan" @mousemove="onPan" @mouseup="endPan" @mouseleave="endPan">
                <div class="cmp-tree" :style="{ transform: 'scale(' + zoom + ')', width: panWidth }">
                  <template v-for="n in rightRows" :key="'R' + n.id">
                    <div :class="['tree-node', 'cmp-node', n.placeholder ? 'is-context' : '']"
                         :style="{ paddingLeft: (n.depth * 20 + 4) + 'px' }" @click="n.placeholder ? null : showOrgDiff(n.id)">
                      <span v-for="(gd, gi) in n.guides" :key="'rg' + gi" class="tree-guide"
                            :style="{ left: (gd * 20 + 12) + 'px', height: (gd.half ? '12px' : '100%') }"></span>
                      <span v-if="n.depth > 0" class="tree-elbow" :style="{ left: (n.depth * 20 - 8) + 'px' }"></span>
                      <div class="tree-row1">
                        <span :class="['tree-toggle', { 'no-child': !n.children.length }]">{{ expanded.has('R' + n.id) ? '−' : '+' }}</span>
                        <span class="tree-name" :title="n.name">{{ n.name }}</span>
                        <span v-if="n.isNew" class="cap cap-add">新增</span>
                        <span v-for="tag in n.tags" :key="tag" :class="capClass(tag)">{{ tag }}</span>
                      </div>
                      <div class="tree-row2 cmp-counts" v-if="!n.placeholder && expanded.has('R' + n.id)">职位 {{ n.s.positions }}｜在职 {{ n.s.employees }}｜编制 {{ n.s.headcounts }}<span v-if="n.s.future">｜未来 {{ n.s.future }}</span></div>
                      <div class="tree-row2 muted" v-if="n.placeholder">该组织调整后停用，详见左侧与变更清单</div>
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- CMP-11—19：变更清单（单选页签，页签计数 = 最终差异对象数） -->
      <div class="card-shadow table-main" style="padding:12px 16px;margin-top:12px">
        <div class="table-toolBox" style="margin-top:0">
          <div class="toolBox-left">
            <a-tabs size="small" v-model:activeKey="tab" style="min-width:520px">
              <a-tab-pane v-for="(cnt, name) in diffCounts" :key="name">
                <template #tab>{{ name }}（{{ cnt }}）</template>
              </a-tab-pane>
            </a-tabs>
          </div>
          <div class="toolBox-right">
            <a-input-search v-model:value="clKw" placeholder="搜索名称 / 编码" size="small" style="width:200px" allow-clear></a-input-search>
          </div>
        </div>
        <div class="baseTableElement">
          <div v-for="(row, ri) in clRows" :key="row.key" class="cl-row" @click="toggleCl(ri)">
            <span class="tree-toggle" style="visibility:visible">{{ clOpen.has(row.key) ? '−' : '+' }}</span>
            <span class="strong" style="margin:0 10px">{{ row.name }}</span>
            <span :class="capClass(row.changeType)">{{ row.changeType }}</span>
            <span v-if="row.reason" class="muted" style="margin-left:8px">{{ row.reason }}</span>
            <span class="cl-preview" v-if="!clOpen.has(row.key) && row.fields.length">
              {{ row.fields[0].label }}：<s>{{ row.fields[0].old }}</s> → {{ row.fields[0].new }}
            </span>
            <span class="muted" v-if="!clOpen.has(row.key) && row.fields.length > 1" style="margin-left:8px">…共 {{ row.fields.length }} 处变化</span>
          </div>
          <div v-for="(row, ri) in clRows" :key="'d' + row.key" v-show="clOpen.has(row.key)" class="cl-detail">
            <div v-for="f in row.fields" :key="f.key" class="cl-field">
              <span class="muted">{{ f.label }}：</span><s>{{ f.old }}</s> → <span class="strong">{{ f.new }}</span>
            </div>
            <div v-if="!row.fields.length" class="muted">{{ row.changeType }}（无字段级明细）</div>
            <div v-if="row.code" class="muted">编码：{{ row.code }}</div>
          </div>
          <!-- CMP-19：空清单与搜索无结果可区分 -->
          <div v-if="!clRows.length" class="muted" style="padding:12px 0">
            {{ clKw.trim() ? '无匹配结果' : '暂无该类变更' }}
          </div>
        </div>
      </div>

      <!-- CMP-01：双入口底栏 -->
      <div class="cmp-footer">
        <template v-if="mode === 'submit'">
          <a-button @click="go('03-工作台.html?plan=' + plan.id)">返回调整</a-button>
          <a-tooltip :title="submitTip">
            <a-button type="primary" :disabled="submitDisabled" @click="doSubmit">确认并提交审批</a-button>
          </a-tooltip>
        </template>
        <a-button v-else @click="go('03-工作台.html?plan=' + plan.id)">返回工作台</a-button>
      </div>
    </div>
  </oa-shell>
</script>

<script src="shared/seed-data.js"></script>
<script src="shared/store.js"></script>
<script src="shared/shell.js"></script>
<script src="shared/ui-kit.js"></script>
<script>
  const S = OA.store;
  S.load();
  const planId = OA.ui.qs('plan');
  const planMeta = planId ? S.getPlan(planId) : null;
  if (!planMeta) { window.location.href = 'index.html'; throw new Error('no plan'); }

  OA.ui.mount({
    template: '#page-tpl',
    data() {
      return {
        plan: planMeta,
        mode: OA.ui.qs('mode') === 'submit' ? 'submit' : 'view', // CMP-01：双入口
        kw: '', clKw: '',
        zoom: 1,
        expanded: new Set(),
        pan: null,
        full: false,
        tab: '组织',
        clOpen: new Set(),
        clOpenAll: false
      };
    },
    created() {
      // 默认展开全部组织行（树较小，保证双图可读）
      this.allRows.forEach(r => { this.expanded.add('L' + r.id); this.expanded.add('R' + r.id); });
      this.expanded = new Set(this.expanded);
      if (this.mode === 'submit') this.clOpenAll = true;
    },
    computed: {
      g() { return S.getPlanData(planId).cur; },
      base() { return S.getPlanData(planId).base; },
      diffCounts() { return S.diffCounts(this.plan); },
      diff() { return S.diffPlan(this.plan); },
      scopeText() {
        return this.plan.sourceScopeIds.concat(this.plan.targetScopeIds)
          .map(id => (S.G.org(this.g, id) || {}).name).filter(Boolean).join('、') || '—';
      },
      /* 左图：调整前基准（含后来停用的组织） */
      leftRows() {
        const rows = this.flatten(S.scopeTreeBase(planId)).filter(n => this.matched(n, 'L'));
        return this.withGuides(rows);
      },
      /* 右图：调整后有效结构；停用组织以占位说明呈现（CMP-07） */
      rightRows() {
        const stopped = new Set(this.g.orgs.filter(o => o.status === '停用').map(o => o.id));
        const flat = this.flatten(S.scopeTree(planId)).filter(n => this.matched(n, 'R'));
        const rows = [];
        flat.forEach(n => {
          if (!stopped.has(n.id)) {
            rows.push(Object.assign({}, n, { isNew: !S.G.org(this.base, n.id), tags: n.isNew ? [] : S.orgChangeTags(this.plan, n.id).filter(t => t !== '新增' && t !== '停用'), placeholder: false, s: S.CNT.orgSummary(this.g, n.id) }));
          }
          // 已停用组织：在右侧以占位说明（不画成有效组织）
          if (stopped.has(n.id) && n.status === '停用') {
            rows.push(Object.assign({}, n, { placeholder: true, isNew: false, tags: [], s: null }));
          }
        });
        return this.withGuides(rows);
      },
      /* 变更清单当前页签行（附编码供搜索） */
      clRowsAll() {
        const g = this.g, b = this.base;
        const codeOf = (cat, id) => {
          if (cat === '组织') return (S.G.org(g, id) || S.G.org(b, id) || {}).code || '';
          if (cat === '职位') return (S.G.position(g, id) || S.G.position(b, id) || {}).code || '';
          if (cat === '编制') return (S.G.hc(g, id) || S.G.hc(b, id) || {}).code || '';
          return '';
        };
        const out = [];
        Object.keys(this.diff).forEach(cat => {
          this.diff[cat].forEach(row => {
            out.push(Object.assign({ key: cat + '-' + row.id, cat, code: codeOf(cat, row.id) }, row));
          });
        });
        return out.filter(x => x.cat === this.tab);
      },
      clRows() {
        const kw = this.clKw.trim().toLowerCase();
        if (!kw) return this.clRowsAll;
        return this.clRowsAll.filter(r =>
          r.name.toLowerCase().includes(kw) || r.code.toLowerCase().includes(kw) ||
          r.fields.some(f => String(f.old).toLowerCase().includes(kw) || String(f.new).toLowerCase().includes(kw))
        );
      },
      hasChange() { return S.hasChange(this.plan); },
      pendingList() { return S.computePending(this.plan); },
      submitDisabled() { return !this.hasChange; }, // SUB/12.3：无差异不可提交（纯排序时 hasChange 为真）
      submitTip() {
        if (!this.hasChange) return '暂无调整内容';
        if (this.pendingList.length) return '存在 ' + this.pendingList.length + ' 项待处理，提交前需处理';
        return '';
      }
    },
    methods: {
      go(url) { OA.ui.go(url); },
      capClass(tag) { if (tag === '新增') return 'cap cap-add'; if (tag === '停用') return 'cap cap-stop'; return 'cap cap-change'; },
      flatten(nodes) {
        const out = [];
        const walk = (list, depth, path) => {
          list.forEach(n => {
            const idx = out.length;
            const myPath = path.concat([idx]);
            out.push(Object.assign({}, n, { depth, idx, path: myPath }));
            walk(n.children, depth + 1, myPath);
          });
        };
        walk(nodes, 0, []);
        return out;
      },
      /* 思维导图连线（与工作台同款）：祖先竖线延伸到最后一个孩子的拐角即收 */
      orgChain(graph, id) { const out = []; let o = S.G.org(graph, id); while (o) { out.unshift(o.id); o = o.parentId ? S.G.org(graph, o.parentId) : null; } return out; },
      withGuides(rows) {
        const n = rows.length;
        const end = new Array(n).fill(0);
        for (let r = n - 1; r >= 0; r--) {
          let e = r;
          for (let k = r + 1; k < n && rows[k].depth > rows[r].depth; k++) e = Math.max(e, end[k]);
          end[r] = e;
        }
        rows.forEach((row, r) => {
          const guides = [];
          row.path.slice(0, row.depth).forEach((ai, gi) => {
            let cLast = -1;
            for (let k = ai + 1; k <= end[ai]; k++) if (rows[k].depth === gi + 1) cLast = k;
            if (cLast === -1) return;
            if (r < cLast) guides.push({ d: gi, half: false });
            else if (r === cLast) guides.push({ d: gi, half: true });
          });
          row.guides = guides;
        });
        return rows;
      },
      matched(n, side) {
        const kw = this.kw.trim().toLowerCase();
        if (!kw) return true;
        const graph = side === 'L' ? this.base : this.g;
        const chain = this.orgChain(graph, n.id);
        return chain.some(id => {
          const o = S.G.org(graph, id);
          return o && (o.name.toLowerCase().includes(kw) || (o.code || '').toLowerCase().includes(kw) || S.G.pathNames(graph, id).join('/').toLowerCase().includes(kw));
        });
      },
      toggleCl(key) { const i = this.clOpen.has(key); if (i) this.clOpen.delete(key); else this.clOpen.add(key); this.clOpen = new Set(this.clOpen); },
      zoomStep(dir) { this.zoom = Math.min(2, Math.max(0.25, Math.round((this.zoom + dir * 0.1) * 10) / 10)); },
      fitCanvas() {
        this.zoom = 1;
        this.$nextTick(() => {
          ['leftView', 'rightView'].forEach(ref => {
            const view = this.$refs[ref]; if (!view) return;
            const tree = view.querySelector('.cmp-tree');
            if (tree && tree.scrollWidth > view.clientWidth) {
              this.zoom = Math.max(0.25, Math.round((view.clientWidth / tree.scrollWidth) * 10) / 10);
            }
          });
        });
      },
      toggleFull() {
        const sec = this.$refs.chartSec;
        if (!this.full && sec.requestFullscreen) { sec.requestFullscreen(); this.full = true; }
        else if (document.fullscreenElement) { document.exitFullscreen(); this.full = false; }
      },
      startPan(e) { this.pan = { x: e.clientX, y: e.clientY, sl: e.currentTarget.scrollLeft, st: e.currentTarget.scrollTop }; e.currentTarget.style.cursor = 'grabbing'; },
      onPan(e) {
        if (!this.pan) return;
        e.currentTarget.scrollLeft = this.pan.sl - (e.clientX - this.pan.x);
        e.currentTarget.scrollTop = this.pan.st - (e.clientY - this.pan.y);
      },
      endPan(e) { this.pan = null; if (e && e.currentTarget) e.currentTarget.style.cursor = 'grab'; },
      /* CMP-09：点击节点显示只读前后详情，关闭保持图位置 */
      showOrgDiff(id) {
        const row = this.diff.orgs.find(x => x.id === id);
        const b = S.CNT.orgSummary(this.base, id), c = S.CNT.orgSummary(this.cur, id);
        const fmt = (k) => b[k] === c[k] ? String(b[k]) : b[k] + ' → ' + c[k];
        const lines = [
          '组织属性：' + (row && row.fields.length ? row.fields.map(f => f.label + ' ' + f.old + ' → ' + f.new).join('；') : '无变化'),
          '职位数：' + fmt('positions'),
          '在职人数：' + fmt('employees'),
          '编制数：' + fmt('headcounts'),
          '未来人员：' + fmt('future')
        ];
        OA.ui.info({ title: (S.G.org(this.g, id) || S.G.org(this.base, id) || {}).name + ' · 前后详情', content: lines.join('\n') });
      },
      /* SUB-01：确认并提交审批；有待处理给出原因与定位入口 */
      doSubmit() {
        const pending = this.pendingList;
        if (pending.length) {
          OA.ui.confirm({
            title: '存在未解决的待处理事项',
            content: pending.map(x => '· ' + x.message).join('\n'),
            okText: '去工作台处理',
            onOk: () => this.go('03-工作台.html?plan=' + planId)
          });
          return;
        }
        const r = S.apply(planId, 'submit', {});
        if (!r.ok) { OA.ui.toast(r.error, 'error'); return; }
        OA.ui.toast('已提交审批（V' + r.version + '），工作台转入只读');
        this.go('05-方案详情.html?plan=' + planId);
      }
    }
  });
</script>
</body>
</html>
